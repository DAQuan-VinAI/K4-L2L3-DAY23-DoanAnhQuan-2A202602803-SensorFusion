[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_lab"
version = "0.1.0"
description = "Day 23 sensor fusion lab platform runtime"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "opencv-python-headless>=4.10,<5",
  "pyyaml",
  "protobuf>=6.33.5,<7",
  "easydict",
  "shapely",
  "torch",
  "tqdm",
]

[project.scripts]
fusion-run-lab = "fusion_lab.scripts.run_lab:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusion_lab*"]

[tool.black]
line-length = 88
extend-exclude = "/third_party/"

[tool.ruff]
line-length = 88
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I"]
